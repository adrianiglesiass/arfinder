app = "arfinder-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Without this block Fly applies soft_limit = 20 and NO hard_limit, so the proxy
  # never sheds load. Sizing rationale (single uvicorn process, 40-thread pool,
  # 40 DB connections, WebSockets assumed to count): specs/fix-abuse-cost-ceiling.md #55.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
