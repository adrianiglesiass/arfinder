<app-page-background>
  <div class="w-full max-w-100 lg:max-w-110 xl:max-w-120 relative z-10">
    <div class="grid grid-cols-[48px_minmax(0,1fr)_48px] items-center mb-4">
      <app-icon-button label="Volver" shape="circle" (click)="onBack()">
        <i class="pi pi-arrow-left text-[18px]" aria-hidden="true"></i>
      </app-icon-button>

      <div class="flex justify-center min-w-0">
        <app-arfinder-logo size="md" />
      </div>

      <span aria-hidden="true"></span>
    </div>

    <div
      class="bg-white/80 backdrop-blur-xl p-6 sm:p-8 lg:p-10 rounded-4xl shadow-glass border border-hairline animate-card-enter"
    >
      @if (showTabs()) {
        <div
          class="flex p-1 bg-gray-100/50 rounded-2xl mb-8 transition-colors duration-200 ease-in-out"
        >
          <a
            routerLink="/login"
            class="flex-1 py-2 text-sm font-medium rounded-xl transition-colors duration-200 ease-in-out text-center"
            [class]="loginTabClass()"
          >
            Entrar
          </a>
          <a
            routerLink="/registro"
            class="flex-1 py-2 text-sm font-medium rounded-xl transition-colors duration-200 ease-in-out text-center"
            [class]="registerTabClass()"
          >
            Registro
          </a>
        </div>
      } @else {
        <div class="text-center mb-8">
          <h2 class="text-2xl font-bold text-primary">Verifica tu email</h2>
          <p class="text-gray-500 mt-2">Hemos enviado un código a tu correo electrónico.</p>
        </div>
      }

      <ng-content />
    </div>
  </div>
</app-page-background>
