<div class="min-h-screen bg-white">
  <header class="sticky top-0 z-30 bg-white/85 backdrop-blur-md border-b border-hairline">
    <div class="w-full max-w-3xl mx-auto px-4 md:px-6 py-3 flex items-center justify-between gap-3">
      <app-back-link [link]="homeLink" label="Volver" />
      <app-arfinder-logo size="sm" />
    </div>
  </header>

  <main class="w-full max-w-3xl mx-auto px-4 md:px-6 py-8 md:py-12">
    <span class="block text-[10px] font-bold text-gray-500 uppercase tracking-[0.2em]">
      Información legal
    </span>
    <h1 class="text-2xl md:text-3xl font-bold text-primary leading-tight mt-2">{{ title() }}</h1>
    <p class="text-xs text-gray-500 font-medium mt-2">
      Última actualización:
      <time [attr.datetime]="lastUpdated()">{{ formattedLastUpdated() }}</time> · Versión
      {{ version() }}
    </p>

    <article
      class="mt-8 text-sm md:text-[15px] leading-relaxed text-gray-700 [&_h2]:text-lg md:[&_h2]:text-xl [&_h2]:font-bold [&_h2]:text-primary [&_h2]:mt-10 [&_h2]:mb-3 [&_h3]:text-base [&_h3]:font-bold [&_h3]:text-primary [&_h3]:mt-6 [&_h3]:mb-2 [&_p]:mb-3 [&_ul]:list-disc [&_ul]:pl-5 [&_ul]:mb-3 [&_li]:mb-1 [&_strong]:font-semibold [&_strong]:text-primary [&_a]:text-primary [&_a]:font-semibold [&_a]:underline [&_code]:text-xs [&_code]:bg-gray-100 [&_code]:rounded [&_code]:px-1 [&_code]:py-0.5 [&_table]:w-full [&_table]:text-left [&_table]:text-xs md:[&_table]:text-sm [&_th]:font-semibold [&_th]:text-primary [&_th]:py-2 [&_th]:pr-4 [&_th]:border-b [&_th]:border-gray-border [&_td]:py-2 [&_td]:pr-4 [&_td]:align-top [&_td]:border-b [&_td]:border-hairline"
    >
      <ng-content />
    </article>

    <footer class="mt-12 pt-6 border-t border-hairline">
      <app-legal-links />
    </footer>
  </main>
</div>
