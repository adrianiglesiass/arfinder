@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center px-4 animate-fade-in">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" aria-hidden="true"></div>

    <div
      role="dialog"
      aria-modal="true"
      aria-labelledby="terms-reconsent-title"
      aria-describedby="terms-reconsent-description"
      class="relative w-full max-w-md bg-white rounded-3xl shadow-(--shadow-glass) p-6 md:p-7"
    >
      <div
        class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-primary mb-4"
      >
        <i class="pi pi-file-check text-lg"></i>
      </div>
      <h3
        id="terms-reconsent-title"
        class="text-lg md:text-xl font-bold text-primary leading-tight"
      >
        Revisa nuestras condiciones
      </h3>
      <p id="terms-reconsent-description" class="text-xs md:text-sm text-gray-500 font-medium mt-2">
        Para seguir usando la aplicación necesitamos que confirmes que eres mayor de edad y que
        aceptas los Términos y condiciones y la Política de privacidad vigentes.
      </p>

      <div class="mt-5">
        <app-terms-consent
          [accepted]="accepted()"
          [showError]="showError()"
          (acceptedChange)="accepted.set($event)"
        />
      </div>

      @if (submitError(); as error) {
        <p class="mt-3 text-xs text-red-500 font-bold" role="alert">{{ error }}</p>
      }

      <div class="mt-6 flex items-center justify-end gap-2">
        <app-button variant="ghost" size="sm" (click)="logout()" [disabled]="isSubmitting()">
          Cerrar sesión
        </app-button>
        <app-button
          size="sm"
          (click)="accept()"
          [disabled]="isSubmitting()"
          [loading]="isSubmitting()"
        >
          Aceptar y continuar
        </app-button>
      </div>
    </div>
  </div>
}
