<button
  type="button"
  (click)="toggle($event)"
  (pointerdown)="$event.stopPropagation()"
  [attr.aria-label]="isFavorite() ? 'Quitar de favoritos' : 'Guardar en favoritos'"
  [attr.aria-pressed]="isFavorite()"
  class="inline-flex items-center justify-center rounded-full transition-all duration-200 active:scale-90 cursor-pointer"
  [class]="appearanceClasses()"
>
  <i
    class="text-[18px]"
    [class]="isFavorite() ? 'pi pi-heart-fill text-red-500' : 'pi pi-heart text-gray-500'"
  ></i>
</button>
