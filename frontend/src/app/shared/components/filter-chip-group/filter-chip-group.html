@if (label()) {
  <span
    [id]="labelId"
    class="block text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em] mb-3 ml-1"
  >
    {{ label() }}
  </span>
}

<div class="flex flex-wrap gap-2" role="group" [attr.aria-labelledby]="label() ? labelId : null">
  @for (opt of options(); track opt.label) {
    <button
      type="button"
      (click)="select(opt)"
      [attr.aria-pressed]="isSelected(opt)"
      [class]="
        isSelected(opt)
          ? 'bg-primary text-white border-primary shadow-sm'
          : 'bg-white border-gray-border text-gray-500 hover:border-gray-400'
      "
      class="px-5 py-2.5 rounded-full border text-[12px] font-bold tracking-tight transition-all duration-200 cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
    >
      {{ opt.label }}
    </button>
  }
</div>
