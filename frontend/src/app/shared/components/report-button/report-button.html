<button
  type="button"
  (click)="open($event)"
  aria-label="Reportar usuario"
  class="inline-flex items-center justify-center gap-2 rounded-full border border-gray-200 bg-white text-[13px] font-semibold text-gray-500 transition-colors cursor-pointer hover:text-red-600 hover:border-red-200"
  [class]="sizeClasses()"
>
  <i class="pi pi-flag text-sm"></i>
  @if (!compact()) {
    Reportar
  }
</button>

@if (showDialog()) {
  <app-report-dialog
    [isSubmitting]="isSubmitting()"
    (dismissed)="close()"
    (submitted)="submit($event)"
  />
}
